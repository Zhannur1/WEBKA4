<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reserve a Table</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/task3.css">
</head>

<body>

    <main class="container py-5">
        <nav class="navbar navbar-expand-md assignment-navbar">
    <div class="container">


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="mainNavbar"
        >
            <div class="navbar-nav ms-auto">

                <a class="nav-link" href="task1.html">
                    Task 1
                </a>

                <a class="nav-link" href="task2.html">
                    Task 2
                </a>

                <a class="nav-link" href="task3.html">
                    Task 3
                </a>

            </div>
        </div>

    </div>
</nav>
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-7">

                <form class="reservation-form">

                    <div class="form-header">
                        <h1>Reserve a table</h1>
                    </div>

                    <div class="form-body">

                        <!-- Name -->
                        <div class="mb-3">

                            <label
                                for="name"
                                class="form-label"
                            >
                                Your name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                            >

                        </div>

                        <!-- Email -->
                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                            >

                        </div>

                        <!-- Phone -->
                        <div class="mb-3">

                            <label
                                for="phone"
                                class="form-label"
                            >
                                Phone
                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                id="phone"
                                name="phone"
                            >

                        </div>

                        <!-- Guests and Date -->
                        <div class="row g-3 mb-3">

                            <div class="col-12 col-md-6">

                                <label
                                    for="guests"
                                    class="form-label"
                                >
                                    Guests
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="guests"
                                    name="guests"
                                    min="1"
                                >

                            </div>

                            <div class="col-12 col-md-6">

                                <label
                                    for="reservationDate"
                                    class="form-label"
                                >
                                    Date
                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="reservationDate"
                                    name="reservationDate"
                                >

                            </div>

                        </div>

                        <!-- Seating -->
                        <fieldset class="mb-3">

                            <legend class="form-label">
                                Seating
                            </legend>

                            <div class="d-flex flex-wrap gap-3">

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="seating"
                                        id="inside"
                                        value="inside"
                                    >

                                    <label
                                        class="form-check-label"
                                        for="inside"
                                    >
                                        Inside
                                    </label>

                                </div>

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="seating"
                                        id="terrace"
                                        value="terrace"
                                    >

                                    <label
                                        class="form-check-label"
                                        for="terrace"
                                    >
                                        Terrace
                                    </label>

                                </div>

                            </div>

                        </fieldset>

                        <!-- Meal -->
                        <div class="mb-3">

                            <label
                                for="meal"
                                class="form-label"
                            >
                                Meal
                            </label>

                            <select
                                class="form-select"
                                id="meal"
                                name="meal"
                            >
                                <option value="lunch">
                                    Lunch
                                </option>

                                <option value="dinner">
                                    Dinner
                                </option>
                            </select>

                        </div>

                        <!-- Comments -->
                        <div class="mb-3">

                            <label
                                for="comments"
                                class="form-label"
                            >
                                Comments
                            </label>

                            <textarea
                                class="form-control"
                                id="comments"
                                name="comments"
                                rows="4"
                            ></textarea>

                        </div>

                        <!-- Agreement -->
                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="terms"
                                name="terms"
                                value="accepted"
                            >

                            <label
                                class="form-check-label"
                                for="terms"
                            >
                                I agree to the terms
                            </label>

                        </div>

                        <!-- Submit -->
                        <button
                            type="submit"
                            class="btn reserve-button"
                        >
                            Reserve
                        </button>

                    </div>

                </form>

            </div>
        </div>

    </main>

</body>

</html>
